plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.optimeal.dev.placeholder"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        // Required by flutter_local_notifications (java.time usage) on
        // minSdk < 26.
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
    }

    defaultConfig {
        // NOTE: deliberate placeholder — OptiMeal vs. Empyria branding is
        // still undecided (trademark check pending). Safe to keep changing
        // until first real Play Store publish; see CLAUDE.md.
        applicationId = "com.optimeal.dev.placeholder"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Launcher label, resolved at build time from OPTIMEAL_ENV.
        //
        // The manifest hardcoded "dreamflow" — the Dreamflow export's own
        // name — so every build Harris installed was called that on the
        // launcher. It is not a placeholder anyone chose; it is a leftover.
        //
        // GATED: trademark clearance. **Both branches read "OptiMeal dev"
        // today, on purpose.** The standing rule is no public branding on any
        // name before CH+EU clearance, and the release branch is the one that
        // would be public. When clearance lands, the prod branch — and only
        // the prod branch — becomes the real name.
        //
        // Resolved from a Gradle property, NOT from --dart-define:
        // dart-defines reach the Dart compiler and never reach Gradle, so the
        // app's own OPTIMEAL_ENV cannot drive the manifest. A prod build that
        // wants the prod label must pass -POPTIMEAL_ENV=prod as well. Until
        // the gate opens that distinction is unobservable, since both strings
        // are identical.
        def optimealEnv = project.findProperty('OPTIMEAL_ENV') ?: 'dev'
        manifestPlaceholders += [
            optimealAppLabel: optimealEnv == 'prod' ? 'OptiMeal dev' : 'OptiMeal dev'
        ]
    }

    buildTypes {
        release {
            // Use release signing if key.properties exists, otherwise fall back to debug
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source = "../.."
}